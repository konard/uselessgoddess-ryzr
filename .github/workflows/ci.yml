name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Logic crates only. ryzr-vcb (the Bevy front-end) is linted in the `app` job,
  # which has the toolchain it needs — keeping this job fast and dependency-free.
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude ryzr-vcb --all-targets -- -D warnings

  # The test suite is the project's correctness contract:
  # - ryzr-core oracle tests pin the synchronous tick semantics,
  # - differential tests run every engine in lockstep against the reference
  #   interpreter on randomized sequential circuits,
  # - ryzr-riscv tests run the gate-level RV32I core in lockstep against the
  #   instruction-level emulator, comparing pc and all 32 registers after
  #   every retired instruction — execution results must match exactly.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude ryzr-vcb
      - name: Test without default features (no jit, no rayon)
        run: cargo test -p ryzr-backend --no-default-features

  # The Bevy front-end on its fast-build path: clang + mold linker (the same
  # .cargo/config_fast_builds.toml a developer opts into locally). The x11/xkb
  # backends are dlopen'd at runtime, so building needs no GUI -dev packages —
  # only the linker toolchain. We lint and build, but don't open a window.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install clang + mold (fast linker)
        run: sudo apt-get update && sudo apt-get install -y clang mold
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Activate the fast-build cargo config
        run: cp .cargo/config_fast_builds.toml .cargo/config.toml
      - run: cargo clippy -p ryzr-vcb --all-targets -- -D warnings
      - run: cargo build -p ryzr-vcb
